spring:
  application:
    name: nseutask
  datasource:
    url: jdbc:postgresql://localhost:5432/nseutask
    username: root
    password: root
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml