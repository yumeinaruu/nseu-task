services:
  postgres:
    image: postgres:16-alpine
    container_name: nseutask-postgres
    environment:
      POSTGRES_DB: nseutask
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nseutask"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: nseutask-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nseutask
    ports:
      - "8080:8080"

volumes:
  postgres-data: